<mend:extend src="_root.html">
    <mend:extend src="_local.html">
        <mend:include src="_sidebar.html" />
    </mend:extend>

    <main>
        <mend:extend src="_header.html">
            <mend:include src="./icons/hashtag.svg" />
        </mend:extend>

        <hr />
        <p>
			A 16x16 (vector) icon pack that prioritizes consistency and quality over quantity. <br />
			Repository: <a href="https://github.com/bbfh-dev/eyecons">github.com/bbfh-dev/eyecons</a>
        </p>

		<section>
			<label for="size">Preview size:</label>
			<select id="size" onchange="onPreviewSizeChanged(this)">
				<option value="12">12x12</option>
				<option value="16">16x16</option>
				<option value="24">24x24</option>
				<option value="32" selected>32x32</option>
				<option value="48">48x48</option>
				<option value="64">64x64</option>
			</select>
		</section>

		<hr />

		<section class="icons" id="eyecons" data-size="16">
			<mend:include src="./gen/__eyecons.html" />
		</section>

		<div id="copied-popup" style="display: none">
			Contents copied!
		</div>

		<script src="/assets/scripts/eyecons.js?version=2">
		</script>
    </main>
</mend:extend>
