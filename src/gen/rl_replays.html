<mend:extend src="../_root.html">
    <mend:extend src="../_local.html">
        <mend:include src="_sidebar.html" />
    </mend:extend>

    <main>
        <mend:extend src="../_header.html">
            <mend:include src="../icons/scroll.svg" />
        </mend:extend>

        <hr />
        <p>
            This page allows you to browse your replays in a human-accessible format, useful when you want
            to share your replay with someone but are unsure of which file is the correct one.
        </p>
        <input type="file" id="upload" accept=".replay" multiple onchange="onUpload(this.files)" />
        <template id="template-replay-row">

        </template>
        <template id="template-replay">
            <section>
                <header>
                    <a class="mobile-button download-replay" download>
                        <!-- @include ../icons/popout.svg -->
                    </a>
                    <strong>
                        <q data-insert="name"></q>
                    </strong>
                    <span class="hide-on-phone" data-insert="timestamp" data-call="getDisplayDate"></span>
                </header>
                <section>
                    <header>
                        <div>Orange</div>
                        <div>Blue</div>
                    </header>
                    <footer class="replay-players">
                    </footer>
                </section>
                <footer data-insert="filename"></footer>
            </section>
        </template>
        <section id="replays">
        </section>
    </main>

    <script src="https://momentjs.com/downloads/moment.min.js"></script>
    <script src="/assets/page/rl_replays/script.js?version=1" defer></script>
</mend:extend>
